complexity:
  active: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 40
    thresholdInInterfaces: 40
    thresholdInObjects: 40
    thresholdInEnums: 40
  LongParameterList:
    active: true
    functionThreshold: 15
    constructorThreshold: 15
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 125
    ignoreAnnotated:
      - 'Composable'
    excludes:
      - '**/test/**'
      - '**/mapper/**'
      - '**/*Mapper.kt'
      - '**/*ViewModel.kt'
  CyclomaticComplexMethod:
    active: true
    threshold: 30
    excludes:
      - '**/test/**'
      - '**/navigation/**'
      - '**/util/**'
      - '**/*Ext.kt'
      - '**/*Mapper.kt'
      - '**/*ViewModel.kt'
  NestedBlockDepth:
    active: true
    threshold: 10

style:
  active: true
  ReturnCount:
    active: true
    max: 6
    excludeGuardClauses: true
  UseCheckOrError:
    active: true
  LoopWithTooManyJumpStatements:
    active: true
    excludes:
      - '**/navigation/**'
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 125
    excludeCommentStatements: true
    excludeRawStrings: true
    excludes:
      - '**/Regex.kt'
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: false
  UnusedPrivateProperty:
    active: false

performance:
  active: true
  SpreadOperator:
    active: true
    excludes:
      - '**/test/**'

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*'
    excludeClassPattern: '.*Test'
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: true
    excludes:
      - '**/test/**'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: true
    excludes:
      - '**/test/**'
  SwallowedException:
    active: true
    excludes:
      - '**/*ViewModel.kt'

potential-bugs:
  active: true
  ImplicitDefaultLocale:
    active: true

Compose:
  active: true
